[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bladeworks"
version = "0.1.5"
description = "Render portable Final Cut Pro XML projects to video."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "torch==2.11.0",
    "av==16.0.1",
    "numpy==2.2.6",
    "tqdm==4.67.1",
    "Pillow==12.2.0",
    "fonttools==4.59.2",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "aiortc>=1.14",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]

[project.urls]
Homepage = "https://github.com/bladeworks-ai/fcpxml"
Repository = "https://github.com/bladeworks-ai/fcpxml"
Issues = "https://github.com/bladeworks-ai/fcpxml/issues"

[project.scripts]
fcpxml = "bladeworks.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["bladeworks*"]

[tool.setuptools.package-data]
bladeworks = ["**/*"]

[tool.setuptools.exclude-package-data]
"*" = [
    "**/__pycache__/*",
    "**/.pytest_cache/*",
    "**/*.pyc",
    "**/*.pyo",
]
