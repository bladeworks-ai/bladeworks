[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bladeworks"
version = "0.1.1"
description = "Render portable Final Cut Pro XML projects to video."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "torch>=2",
    "av>=15",
    "numpy",
    "tqdm",
    "Pillow>=10",
    "fonttools>=4.50",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "aiortc>=1.14",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/bladeworks-ai/bladeworks"
Repository = "https://github.com/bladeworks-ai/bladeworks"
Issues = "https://github.com/bladeworks-ai/bladeworks/issues"

[project.scripts]
bladeworks = "bladeworks.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["bladeworks*"]

[tool.setuptools.package-data]
bladeworks = ["**/*"]

[tool.setuptools.exclude-package-data]
"*" = [
    "**/__pycache__/*",
    "**/.pytest_cache/*",
    "**/*.pyc",
    "**/*.pyo",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
