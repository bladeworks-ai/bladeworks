name: Supported installers

on:
  pull_request:
  push:
    branches: [main]

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install from the generated checkout
        env:
          BLADEWORKS_SPEC: ${{ github.workspace }}
        run: ./install-linux.sh
      - run: ~/.local/bin/bladeworks doctor

  homebrew:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: brew install --formula ./Formula/bladeworks.rb
      - run: brew test bladeworks
